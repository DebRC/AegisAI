apiVersion: v1
kind: ConfigMap
metadata:
  name: aegisai-config
  labels:
    app.kubernetes.io/part-of: aegisai
data:
  APP_NAME: AegisAI
  APP_VERSION: replace-with-immutable-image-tag
  APP_ENV: production
  HOST: 0.0.0.0
  PORT: "8000"
  QDRANT_URL: http://qdrant:6333
  QDRANT_COLLECTION_NAME: aegis_document_chunks_v1
  QDRANT_TIMEOUT_SECONDS: "10"
  OBSERVABILITY_DEPENDENCY_TIMEOUT_SECONDS: "1"
  EMBEDDING_PROVIDER: openai
  EMBEDDING_MODEL: text-embedding-3-small
  EMBEDDING_VECTOR_DIMENSION: "1536"
  EMBEDDING_BATCH_SIZE: "64"
  EMBEDDING_REQUEST_TIMEOUT_SECONDS: "30"
  CHAT_PROVIDER: openai
  CHAT_MODEL: gpt-5.6
  CHAT_REQUEST_TIMEOUT_SECONDS: "60"
  CHAT_MAX_OUTPUT_TOKENS: "1024"
  CHAT_MAX_CONTEXT_CHARACTERS: "24000"
  OPENAI_BASE_URL: https://api.openai.com/v1
  DOCUMENT_STORAGE_PATH: /data/documents
  DOCUMENT_MAX_UPLOAD_BYTES: "26214400"
  DOCUMENT_MAX_EXTRACTED_TEXT_CHARACTERS: "5000000"
  DOCUMENT_CHUNK_TARGET_CHARACTERS: "1200"
  DOCUMENT_CHUNK_OVERLAP_CHARACTERS: "200"
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CELERY_TASK_DEFAULT_QUEUE: aegis-processing
  CELERY_TASK_TIME_LIMIT_SECONDS: "600"
  CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: "540"
  PROCESSING_OUTBOX_DISPATCH_INTERVAL_SECONDS: "30"
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  SSO_ENABLED: "false"
  SSO_CALLBACK_BASE_URL: https://api.aegisai.example.com
  SSO_FRONTEND_REDIRECT_URL: https://aegisai.example.com
  SSO_TRANSACTION_EXPIRE_MINUTES: "5"
  MICROSOFT_ENTRA_TENANT_ID: organizations
