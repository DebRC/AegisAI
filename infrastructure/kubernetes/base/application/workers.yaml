apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  labels:
    app.kubernetes.io/name: celery-worker
    app.kubernetes.io/part-of: aegisai
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: celery-worker
      app.kubernetes.io/part-of: aegisai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celery-worker
        app.kubernetes.io/part-of: aegisai
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: celery-worker
          image: aegisai-backend:replace-me
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO"]
          envFrom:
            - configMapRef:
                name: aegisai-config
            - secretRef:
                name: aegisai-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: document-storage
              mountPath: /data/documents
      volumes:
        - name: document-storage
          persistentVolumeClaim:
            claimName: document-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  labels:
    app.kubernetes.io/name: celery-beat
    app.kubernetes.io/part-of: aegisai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: celery-beat
      app.kubernetes.io/part-of: aegisai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celery-beat
        app.kubernetes.io/part-of: aegisai
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: celery-beat
          image: aegisai-backend:replace-me
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO"]
          envFrom:
            - configMapRef:
                name: aegisai-config
            - secretRef:
                name: aegisai-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
