# Apply this Job after the platform is healthy and before application workloads.
# It is intentionally outside the default base kustomization to make that order explicit.
apiVersion: batch/v1
kind: Job
metadata:
  name: aegisai-migrate
  labels:
    app.kubernetes.io/name: migration
    app.kubernetes.io/part-of: aegisai
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migration
        app.kubernetes.io/part-of: aegisai
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: migrate
          image: aegisai-backend:replace-me
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: aegisai-config
            - secretRef:
                name: aegisai-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
