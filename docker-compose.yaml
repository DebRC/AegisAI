services:

  backend:

    build: ./backend

    ports:
      - "8000:8000"

    env_file:
      - backend/.env

    volumes:
      - document_data:/data/documents

    command: ["/bin/sh", "/app/scripts/start_backend.sh"]

    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  redis:

    image: redis:7.4-alpine

    restart: always

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  celery-worker:

    build: ./backend

    env_file:
      - backend/.env

    volumes:
      - document_data:/data/documents

    command:
      ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO"]

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:

    build: ./backend

    env_file:
      - backend/.env

    command:
      ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO"]

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:

    image: postgres:16

    restart: always

    environment:
      POSTGRES_DB: aegis

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:

    image: qdrant/qdrant

    restart: always

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

volumes:

  postgres_data:

  qdrant_data:

  document_data:
