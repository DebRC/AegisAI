version: "3.9"

services:

  backend:

    build: ./backend

    ports:
      - "8000:8000"

    env_file:
      - backend/.env

    depends_on:
      - postgres
      - qdrant

  postgres:

    image: postgres:16

    restart: always

    environment:
      POSTGRES_DB: aegis

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:

    image: qdrant/qdrant

    restart: always

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

volumes:

  postgres_data:

  qdrant_data: